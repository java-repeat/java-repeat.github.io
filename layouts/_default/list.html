{{ define "main" }}
<div class="wrap docs">
{{ partial "sidebar.html" . }}
<div class="docs-main">
<article class="article">
<p class="breadcrumb">{{ partial "breadcrumb.html" . }}</p>
<h1>{{ .Title }}</h1>
{{ with .Params.lede }}<p class="lede">{{ . | markdownify }}</p>{{ end }}
<div class="prose">
{{ .Content }}
</div>
<div class="cards">
{{ range .Pages.ByWeight }}
<a class="card" href="{{ .RelPermalink }}">
<span class="card-title">{{ .Title }}</span>
<span class="card-text">{{ .Description }}</span>
</a>
{{ end }}
</div>
</article>
</div>
</div>
{{ end }}
