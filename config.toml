baseURL = "https://java-repeat.github.io/"

languageCode = "en-us"
title = "java-repeat"
enableGitInfo = true
disableKinds = ["taxonomy", "term"]

[markup]
[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
noClasses = false
[markup.tableOfContents]
startLevel = 2
endLevel = 4

[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
description = "Kotlin-style repetition for Java, with support for checked exceptions."
# Fallback for local builds. CI sets HUGO_PARAMS_VERSION to the latest release on Maven Central.
version = "1.0.1"
coordinates = "io.github.java-repeat:repeat"
github = "https://github.com/java-repeat/java-repeat"
releases = "https://github.com/java-repeat/java-repeat/releases"
issues = "https://github.com/java-repeat/java-repeat/issues"
maven = "https://search.maven.org/artifact/io.github.java-repeat/repeat"
javadoc = "https://javadoc.io/doc/io.github.java-repeat/repeat/latest/io/github/repeat/package-summary.html"
editURL = "https://github.com/java-repeat/java-repeat.github.io/edit/main/content/"

