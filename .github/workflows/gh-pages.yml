name: github pages

on:
  push:
    branches:
      - main
  # Rebuild daily so the docs pick up new releases from Maven Central.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Resolve latest release
        run: |
          version=$(curl -fsSL --retry 3 https://repo1.maven.org/maven2/io/github/java-repeat/repeat/maven-metadata.xml \
            | sed -n 's:.*<release>\(.*\)</release>.*:\1:p')
          if [ -z "$version" ]; then
            echo "::warning::Could not read the latest release from Maven Central; using the version in config.toml"
          else
            echo "Latest release: $version"
            echo "HUGO_PARAMS_VERSION=$version" >> "$GITHUB_ENV"
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
